name: absen_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  signature: ^5.4.1
  iconsax: ^0.0.8
  csv: ^5.1.1
  http: ^1.1.0
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  camera: ^0.10.5+5
  permission_handler: ^11.0.1
  mobile_scanner: ^4.0.0
  shimmer: ^3.0.0
  path_provider: ^2.1.3 # pastikan versi terbaru
  device_info_plus: ^10.1.0 # pastikan versi terbaru
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  line_awesome_flutter: ^3.0.1
  flutter_secure_storage: ^9.2.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png" 
  min_sdk_android: 21 # optional
