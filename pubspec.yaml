name: absen_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  csv: ^5.1.1
  http: ^1.1.0
  dio: ^5.4.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  mobile_scanner: ^4.0.0
  camera: ^0.10.5
  shimmer: ^3.0.0
  path_provider: ^2.1.3
  device_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  line_awesome_flutter: ^3.0.1
  flutter_secure_storage: ^10.0.0-beta.5
  file_picker: ^10.3.7
  uuid: ^4.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png" 
  min_sdk_android: 21 # optional
